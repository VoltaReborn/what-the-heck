/* Bid-flow fix v1.1: paced table bidding + compact non-blocking user bid panel */
#bidModal{background:transparent!important;place-items:initial!important;padding:0!important;pointer-events:none;z-index:9300;}
#bidModal.open{display:block!important;}
#bidModal .modalCard{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:min(86vw,326px);max-height:42dvh;grid-template-rows:auto minmax(0,1fr);border-radius:14px;background:rgba(12,22,28,.96);box-shadow:0 10px 32px rgba(0,0,0,.44),0 0 0 1px rgba(240,202,104,.08);pointer-events:auto;}
#bidModal .modalHead{padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.1);}
#bidModal .modalHead strong{font-size:.82rem;}
#bidModal .modalBody{padding:7px 8px 8px;overflow-y:auto;}
#bidModal .smallHelp{font-size:.66rem;line-height:1.18;margin:0 0 6px;color:#d6e4ea;}
#bidModal .bidGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;}

function responsiveSuitOrder(hand){
  const base=['♠','♦','♣','♥'];
  const color=s=>s==='♠'||s==='♣'?'black':'red';
  const present=base.filter(s=>hand.some(c=>c.suit===s));
  if(present.length<=1)return present;
  const perms=(arr)=>{
    if(arr.length<=1)return [arr];
    const out=[];
    arr.forEach((item,i)=>{
      const rest=arr.slice(0,i).concat(arr.slice(i+1));
      perms(rest).forEach(p=>out.push([item].concat(p)));
    });
    return out;
  };
  const baseIndex=Object.fromEntries(base.map((s,i)=>[s,i]));
  const firstPreferred=present[0];
  const score=(order)=>{
    let alternations=0;
    for(let i=1;i<order.length;i++){
      if(color(order[i])!==color(order[i-1]))alternations++;
    }
    let inversions=0;
    for(let i=0;i<order.length;i++){
      for(let j=i+1;j<order.length;j++){
        if(baseIndex[order[i]]>baseIndex[order[j]])inversions++;
      }
    }
    return alternations*100 + (order[0]===firstPreferred?8:0) - inversions*3;
  };
  return perms(present).sort((a,b)=>score(b)-score(a))[0];
}

function popDrawerTab(){document.body.classList.add('menuReady','drawerTabPop');setTimeout(()=>document.body.classList.remove('drawerTabPop'),650);}
function exitSplash(){
  if(els.splash.classList.contains('hidden')){
    document.body.classList.remove('splashShowing','splashExiting');
    popDrawerTab();
    return;
  }

  const original=els.splash;
  document.body.classList.add('splashExiting');
  document.body.classList.remove('menuReady','drawerTabPop');

  // Build a fresh, isolated animation layer. This avoids the older splash classes,
  // reduced-motion rules, inline transforms, and modal timing from interfering.
  document.querySelectorAll('.splashTurnClone').forEach(node=>node.remove());
  const clone=original.cloneNode(true);
  clone.id='splashTurnClone';
  clone.className='splashTurnClone';
  clone.setAttribute('aria-hidden','true');
  clone.querySelectorAll('button,select,input').forEach(el=>{
    el.tabIndex=-1;
    el.disabled=true;
  });
  document.body.appendChild(clone);

  // Reveal the already-rendered game underneath immediately, while the clone turns away.
  original.classList.add('hidden');
  original.classList.remove('prepareFlip','exit','dismissing','fadeOnly');
  original.style.removeProperty('animation');
  original.style.removeProperty('transform');
  original.style.removeProperty('opacity');

  const duration=360;
  const start=performance.now();
  const ease=t=>1-Math.pow(1-t,3.1);
  let done=false;

  const finish=()=>{
    if(done)return;
    done=true;
    clone.remove();
    document.body.classList.remove('splashShowing','splashExiting');
    popDrawerTab();
  };

  const tick=now=>{
    if(done)return;
    const t=Math.min(1,(now-start)/duration);
    const e=ease(t);
    const rotate=89.6*e;
    const scaleX=1-(0.96*e);
    const scaleY=1-(0.04*e);
    const shadow=48+(42*e);
    clone.style.transform=`perspective(980px) rotateY(${rotate}deg) scaleX(${scaleX}) scaleY(${scaleY}) translate3d(0,0,0)`;
    clone.style.opacity=String(t<0.78?1:Math.max(0,1-((t-0.78)/0.22)));
    clone.style.filter=`drop-shadow(${Math.round(10*e)}px 0 ${Math.round(shadow)}px rgba(0,0,0,.44))`;
    if(t<1){
      requestAnimationFrame(tick);
    }else{
      finish();
    }
  };

  // Two frames guarantees the clone is painted once at full size before it starts turning.
  requestAnimationFrame(()=>requestAnimationFrame(tick));
  setTimeout(finish,duration+180);
}

    aiTimer=setTimeout(()=>{
      biddingAnimating=false;

    },pacing.ask);
    return;
  }
  biddingAnimating=true;
  bidThinkingIndex=idx;
  showBidBubble(idx,'…','thinking');

  const bid=aiBid(p);

      hideBidBubble(false);

async function animatePlayedCardToTrick(card,sourceRect,sprite){

  const dx=(targetRect.left+targetRect.width/2)-(sourceRect.left+sourceRect.width/2);
  const dy=(targetRect.top+targetRect.height/2)-(sourceRect.top+sourceRect.height/2);
  const sx=targetRect.width/sourceRect.width;
  const sy=targetRect.height/sourceRect.height;

    {transform:'translate3d(0,0,0) scale(1)',opacity:1},
    {transform:`translate3d(${dx*.52}px,${dy*.52}px,0) scale(${(1+sx)/2},${(1+sy)/2})`,opacity:1,offset:.55},

function legalCardsFor(playerIndex){
  const p=game.players[playerIndex];
  if(game.phase!=='playing')return [];
  if(game.currentTrick.length===0){
    if(game.trumpBroken)return p.hand.map(c=>c.id);
    const nonTrump=p.hand.filter(c=>c.suit!==game.trumpSuit);
    return (nonTrump.length?nonTrump:p.hand).map(c=>c.id);
  }
  const led=game.currentTrick[0].card.suit;
  const follow=p.hand.filter(c=>c.suit===led);
  return (follow.length?follow:p.hand).map(c=>c.id);
}
function illegalReason(card){
  if(!game||game.phase!=='playing')return 'You cannot play a card right now.';
  if(game.turnIndex!==0)return settings.queue?'It is not your turn. Turn on queueing or wait for your turn.':'It is not your turn yet.';
  if(game.currentTrick.length===0&&!game.trumpBroken&&card.suit===game.trumpSuit&&human().hand.some(c=>c.suit!==game.trumpSuit))return 'Trump has not been broken. You can only lead trump if you only have trump cards.';
  if(game.currentTrick.length>0){const led=game.currentTrick[0].card.suit;if(card.suit!==led&&human().hand.some(c=>c.suit===led))return `You must follow ${SUIT_NAMES[led]}.`;}
  return 'That is not a legal card right now.';
}
function onHumanCardTap(cardId){
  if(cardMotionActive)return;
  if(!game)return;
  const card=human().hand.find(c=>c.id===cardId);if(!card)return;
  if(game.phase!=='playing'){showToast('You cannot play during bidding or scoring.');return;}
  if(game.turnIndex!==0){
    if(settings.queue){game.queuedCardId=cardId;showToast(`Queued ${cardLabel(card)} for your next turn.`);render();saveGame();}else showToast('It is not your turn yet.');
    return;
  }
  const legal=legalCardsFor(0).includes(cardId);
  if(!legal){showToast(illegalReason(card));return;}
  if(settings.confirmPlay){pendingConfirm=cardId;els.confirmBody.innerHTML=`<p>Play this card?</p><div style="display:grid;place-items:center;margin:12px 0">${cardHTML(card)}</div>`;openModal(els.confirmModal);}else playHumanCard(cardId);
}
function playHumanCard(cardId){pendingConfirm=null;closeModal(els.confirmModal);playCard(0,cardId);}
function continuePlay(){
  if(!game||game.phase!=='playing')return;
  render();saveGame();
  const p=currentPlayer();
  if(p.human){
    if(settings.queue&&game.queuedCardId){const queued=game.queuedCardId;game.queuedCardId=null;if(legalCardsFor(0).includes(queued)){const card=human().hand.find(c=>c.id===queued);showToast(`Playing queued ${cardLabel(card)}.`);if(settings.confirmPlay){pendingConfirm=queued;els.confirmBody.innerHTML=`<p>Play queued card?</p><div style="display:grid;place-items:center;margin:12px 0">${cardHTML(card)}</div>`;openModal(els.confirmModal);}else aiTimer=setTimeout(()=>playHumanCard(queued),220);return;}showToast('Queued card is no longer legal. Choose a card.');render();}
    return;
  }
  aiTimer=setTimeout(()=>{const card=aiChooseCard(game.turnIndex);playCard(game.turnIndex,card.id);},delayMs());
}
async function playCard(playerIndex,cardId){
  if(cardMotionActive)return;
  if(!game||game.phase!=='playing')return;
  const p=game.players[playerIndex];
  const idx=p.hand.findIndex(c=>c.id===cardId);
  if(idx<0)return;
  const card=p.hand[idx];
  const legal=legalCardsFor(playerIndex).includes(cardId);
  if(!legal){if(p.human)showToast(illegalReason(card));return;}

  const sourceEl=playerIndex===0?cardElById(cardId,els.handGrid):null;
  const sourceRect=sourceRectForPlay(playerIndex,cardId);
  if(sourceEl)sourceEl.style.visibility='hidden';
  const sprite=createCardPlaySprite(card,sourceRect);

  cardMotionActive=true;
  cardMotionCardId=card.id;
  try{
    const wasFollowingNeeded=game.currentTrick.length>0&&p.hand.some(c=>c.suit===game.currentTrick[0].card.suit);
    p.hand.splice(idx,1);
    const ledSuit=game.currentTrick.length?game.currentTrick[0].card.suit:null;
    game.currentTrick.push({playerIndex,card});
    game.cardCountThisTrick+=1;
    if(card.suit===game.trumpSuit){showTrumpBang();if(ledSuit&&ledSuit!==game.trumpSuit&&!wasFollowingNeeded)game.trumpBroken=true;}
    log(`${p.name} plays ${cardLabel(card)}`,buildPlayExplanation(playerIndex,card));
    explain(buildPlayExplanation(playerIndex,card));
    game.turnIndex=clockwiseNext(playerIndex);
    render();
    saveGame();
    await animatePlayedCardToTrick(card,sourceRect,sprite);
  }finally{
    cardMotionActive=false;
    cardMotionCardId=null;
    render();
  }
  if(game.currentTrick.length===game.players.length){
    aiTimer=setTimeout(resolveTrick,delayMs());
  }else{
    continuePlay();
  }
}
function buildPlayExplanation(playerIndex,card){
  const p=game.players[playerIndex];
  if(game.currentTrick.length===1)return `${p.name} led ${cardLabel(card)}. Everyone who can follow ${SUIT_NAMES[card.suit]} must do so.`;
  const led=game.currentTrick[0].card.suit;
  if(card.suit===game.trumpSuit&&led!==game.trumpSuit)return `${p.name} could not follow ${SUIT_NAMES[led]} and played trump. Highest trump wins this trick.`;
  if(card.suit===led)return `${p.name} followed ${SUIT_NAMES[led]} with ${cardLabel(card)}.`;
  return `${p.name} could not follow ${SUIT_NAMES[led]} and played off-suit ${cardLabel(card)}.`;
}

async function animateTrickPileToWinner(winner){

  const trick=[...game.currentTrick];
  const winnerEntry=trick.find(t=>t.playerIndex===winner.playerIndex&&t.card.id===winner.card.id)||winner;
  const winnerEl=getTrickCardEl(winner.card.id);

  await sleep(520*scale);
  winnerEl.classList.remove('trickRainbowWin');

  const winnerRect=winnerEl.getBoundingClientRect();
  const sprites=[];
  const pileOffsets=[
    {x:-5,y:5,rot:-5},{x:5,y:4,rot:4},{x:-3,y:-4,rot:3},{x:4,y:-5,rot:-3},{x:0,y:6,rot:2},{x:-6,y:-1,rot:-4}
  ];

  await Promise.all(sprites.map((s,idx)=>{
    const start=s.isWinner
      ? {...pileBase,transform:'rotate(0deg) scale(1)'}
      : {left:winnerRect.left+s.offset.x,top:winnerRect.top+s.offset.y,width:winnerRect.width,height:winnerRect.height,transform:`rotate(${s.offset.rot}deg) scale(.985)`};

async function resolveTrick(){
  if(cardMotionActive)return;
  if(!game||game.currentTrick.length!==game.players.length)return;
  cardMotionActive=true;
  const winner=determineTrickWinner(game.currentTrick);
  const winnerPlayer=game.players[winner.playerIndex];
  const oldTricks=winnerPlayer.tricks;
  const winnerStats=ensurePlayerStats(winnerPlayer);
  winnerStats.tricksWon+=1;
  if(winner.card.suit===game.trumpSuit){winnerStats.trumpWon+=1;winnerPlayer.handTrumpWon=(winnerPlayer.handTrumpWon||0)+1;}else{winnerStats.nonTrumpWon+=1;winnerPlayer.handNonTrumpWon=(winnerPlayer.handNonTrumpWon||0)+1;}
  const led=game.currentTrick[0].card.suit;
  const trumpPlayed=game.currentTrick.some(t=>t.card.suit===game.trumpSuit);
  const reason=trumpPlayed?`${winnerPlayer.name} won because ${cardLabel(winner.card)} was the highest trump.`:`${winnerPlayer.name} won because ${cardLabel(winner.card)} was the highest ${SUIT_NAMES[led]} card.`;
  explain(reason);
  log(`${winnerPlayer.name} wins the trick`,reason);
  const newTricks=oldTricks+1;
  const reachedBid=winnerPlayer.bid!==null&&winnerPlayer.bid>0&&oldTricks<winnerPlayer.bid&&newTricks===winnerPlayer.bid;
  const wentOverBid=winnerPlayer.bid!==null&&oldTricks<=winnerPlayer.bid&&newTricks>winnerPlayer.bid;
  try{
    await animateTrickPileToWinner(winner);
    await animateTrickCountAward(winner.playerIndex,oldTricks,newTricks);
    if(wentOverBid)await showMissedBidWarning(winner.playerIndex);
    else if(reachedBid)await showMetBidWarning(winner.playerIndex);
  }finally{
    cardMotionActive=false;
  }
  game.currentTrick=[];
  game.leaderIndex=winner.playerIndex;
  game.turnIndex=winner.playerIndex;
  game.cardCountThisTrick=0;
  if(game.players.every(p=>p.hand.length===0)){
    scoreHand();
  }else{
    render();
    saveGame();
    continuePlay();
  }
}

function determineTrickWinner(trick){
  const trumpCards=trick.filter(t=>t.card.suit===game.trumpSuit);
  const contenders=trumpCards.length?trumpCards:trick.filter(t=>t.card.suit===trick[0].card.suit);
  return contenders.reduce((best,t)=>cardValue(t.card)>cardValue(best.card)?t:best,contenders[0]);
}
function scoreHand(){
  game.phase='handOver';const rows=[];
  for(const p of game.players){
    const exact=p.tricks===p.bid;
    const points=p.tricks+(exact?10:0);
    const s=ensurePlayerStats(p);
    s.hands+=1;
    s.totalBid+=Number(p.bid)||0;
    s.totalWon+=p.tricks;
    s.bidHistory.push(Number(p.bid)||0);
    s.wonHistory.push(p.tricks);
    s.trumpWonHistory.push(p.handTrumpWon||0);
    s.nonTrumpWonHistory.push(p.handNonTrumpWon||0);
    s.exactHistory.push(exact?1:0);
    s.zeroBidHistory.push(p.bid===0?1:0);
    if(p.bid===0)s.zeroBids+=1;
    if(exact)s.bidHits+=1;else s.bidMisses+=1;
    if(p.bid!==null&&p.tricks>p.bid)s.overBidHands+=1;
    p.score+=points;
    rows.push({name:p.name,bid:p.bid,tricks:p.tricks,exact,points,total:p.score});
  }
  game.recap=rows;log(`Hand ${game.handNumber} scored`,rows.map(r=>`${r.name}: bid ${r.bid}, won ${r.tricks}, +${r.points}`).join(' · '));
  render();saveGame();showRecap(false);
}
function advanceAfterRecap(){
  closeModal(els.recapModal);
  if(game.phase==='gameOver'){return;}
  if(game.tiebreakerActive){
    const top=tiebreakerTop();
    if(top.length===1){finishGame();return;}
    game.tiebreakerFor=top;game.dealerIndex=clockwiseNext(game.dealerIndex);startHand(game.finalHandSize);return;
  }
  game.handIndex+=1;game.dealerIndex=clockwiseNext(game.dealerIndex);

    finishGame();return;
  }
  startHand();
}

function tiebreakerTop(){const eligible=game.tiebreakerFor||topPlayers();const best=Math.max(...eligible.map(i=>game.players[i].score));return eligible.filter(i=>game.players[i].score===best);}

function bidTotalSoFar(){
  return game.players.reduce((sum,x)=>sum+(typeof x.bid==='number'?x.bid:0),0);
}
function aiBid(p){
  const hand=p.hand;
  const handSize=Math.max(1,game.handSize);
  const playerIndex=game.players.indexOf(p);
  const openingLeader=playerIndex===game.leaderIndex;
  const lowRound=handSize<=2;
  const shortRound=handSize<=4;
  const totalBid=bidTotalSoFar();
  const pressure=totalBid/handSize;
  const remainingBidders=countRemainingBidders();
  const openTricks=handSize-totalBid;

  let trumpExpected=0;
  let nonTrumpExpected=0;
  let guaranteed=0;
  let highNonTrumpCount=0;
  const trump=hand.filter(c=>c.suit===game.trumpSuit);

  for(const c of hand){
    const v=cardValue(c);
    const sameSuitCount=hand.filter(x=>x.suit===c.suit).length;
    if(c.suit===game.trumpSuit){
      let val=0;
      if(lowRound) val=v>=14?.99:v>=13?.92:v>=12?.74:v>=11?.50:v>=10?.34:.22;
      else if(shortRound) val=v>=14?.98:v>=13?.88:v>=12?.70:v>=11?.48:v>=10?.33:.19;
      else val=v>=14?.98:v>=13?.86:v>=12?.68:v>=11?.48:v>=10?.34:.18;
      // Low-card rounds have fewer chances to break/lead trump, so low trump is not automatic.
      if(lowRound&&v<12&&!openingLeader)val-=.06;
      trumpExpected+=val;
      if(v>=14)guaranteed+=1;
      else if(v>=13)guaranteed+=lowRound?.85:.75;
      else if(v>=12)guaranteed+=lowRound?.58:.45;
    }else{
      let val=0;
      if(lowRound){
        val=v===14?.78:v===13?.56:v===12?.36:v===11?.20:v>=10?.10:.025;
        if(openingLeader&&v>=12)val+=.16;          // leading a high card matters more with 1–2 cards
        if(!openingLeader&&sameSuitCount===1&&v>=12)val-=.08; // may never get led, but can sometimes dump
      }else if(shortRound){
        val=v===14?.72:v===13?.46:v===12?.28:v===11?.16:v>=10?.08:.02;
        if(openingLeader&&v>=13)val+=.10;
      }else{
        val=v===14?.66:v===13?.38:v===12?.21:v===11?.12:v>=10?.06:.015;
        if(sameSuitCount===1&&v>=12)val-=.10;
      }
      if(v>=12)highNonTrumpCount+=1;
      nonTrumpExpected+=val;
    }
  }

  const suitCounts=SUITS.map(s=>hand.filter(c=>c.suit===s).length);
  const voids=suitCounts.filter(n=>n===0).length;
  const singles=suitCounts.filter(n=>n===1).length;
  let shapeBonus=(lowRound?voids*.05:shortRound?voids*.10:voids*.14)+(lowRound?singles*.02:singles*.04)+Math.max(0,trump.length-1)*(lowRound?.04:.10);

  // If everyone is bidding low late in a short round, high cards become more attractive.
  if(lowRound&&totalBid===0&&remainingBidders<=2){
    nonTrumpExpected*=1.22;
    if(openingLeader)nonTrumpExpected+=.16;
  }else if(shortRound&&totalBid<=Math.max(0,handSize-2)&&pressure<.55){
    nonTrumpExpected*=1.10;
  }

  // Real-table caution: high table bids scare players off marginal tricks,
  // especially high non-trump cards that could be trumped or avoided.
  if(pressure>=.75){
    const caution=Math.min(.82,(pressure-.75)*1.25+(lowRound?.10:.18));
    nonTrumpExpected*=Math.max(lowRound?.34:.18,1-caution);
    shapeBonus*=Math.max(.35,1-caution*.70);
  }
  if(pressure>=1){
    nonTrumpExpected*=lowRound?.48:.35;
    shapeBonus*=.45;
    trumpExpected-=Math.min(.55,(pressure-1)*.62+(lowRound?.10:.18));
  }
  if(pressure<.55&&!lowRound){
    nonTrumpExpected*=1.10;
    shapeBonus+=.08;
  }

  const longHandEstimate=estimateLongHandBid(p);
  const longHand=longHandEstimate!==null;
  let expected=Math.max(0,trumpExpected+nonTrumpExpected+shapeBonus);
  if(longHand)expected=Math.max(expected,longHandEstimate);


  // Bidding uses the same logic on every difficulty. Difficulty affects play only.
  if(totalBid+expected<handSize*.72&&remainingBidders<=2)expected+=lowRound?.08:.15;
  if(totalBid>handSize*.95)expected-=lowRound?.18:.28;

  if(handSize===1){
    const only=hand[0];
    expected=(only.suit===game.trumpSuit?0.64:cardValue(only)>=13?0.44:cardValue(only)===12?0.26:0.10)+(openingLeader?.16:0);
    if(totalBid>=1)expected-=.32;
  }

  let noise=rand(-.28,.28);
  if(lowRound)noise*=.72;
  let bid=Math.round(expected+noise);

  if(pressure>=.88){
    if(longHand){
      bid=Math.round(bid*(pressure>=1?.92:.97));
      if(longHandEstimate!==null)bid=Math.max(bid,Math.round(longHandEstimate*(game.players.length===2?.82:.68)));
    }else{
      const safeExtra=Math.max(0,Math.round(guaranteed-.25));
      const cautiousCap=Math.max(0,openTricks)+safeExtra+(lowRound&&totalBid===0&&highNonTrumpCount?1:0)+(Math.random()<.14?1:0);
      bid=Math.min(bid,cautiousCap);
    }
  }
  if(totalBid>=handSize&&!longHand){
    const onlyLocks=Math.max(0,Math.round(guaranteed-(lowRound?.05:.15)));
    bid=Math.min(bid,onlyLocks+(lowRound&&openingLeader&&highNonTrumpCount&&Math.random()<.18?1:0));
  }

  // Do not make every late AI turtle just because the table is exactly called.
  // Other players may be wrong. A reasonable trump holding should still tempt a bid.
  const maxTrumpRank=trump.length?Math.max(...trump.map(cardValue)):0;
  const normalOvercall=totalBid<=handSize;
  if(trump.length&&normalOvercall){
    let trumpPush=0;
    if(handSize<=2){
      if(maxTrumpRank>=9)trumpPush=1;
      if(trump.length>=2&&maxTrumpRank>=11)trumpPush=2;
    }else if(handSize<=4){
      if(maxTrumpRank>=10 || trump.length>=2)trumpPush=1;
      if((maxTrumpRank>=13&&trump.length>=2)||trump.length>=3)trumpPush=2;
    }else{
      if(maxTrumpRank>=11 || trump.length>=2)trumpPush=1;
      if(maxTrumpRank>=13&&trump.length>=3)trumpPush=2;
    }
    // Slightly less fearless if many bidders still remain.
    if(remainingBidders>2&&trumpPush>1)trumpPush=1;
    bid=Math.max(bid,Math.min(handSize,trumpPush));
  }else if(trump.length&&totalBid<handSize*1.5&&Math.random()<.35){
    if(maxTrumpRank>=12||trump.length>=2)bid=Math.max(bid,1);
  }

  // In a 2-card hand, even a 9 of trump is a real threat. If the table is only
  // normally called (2/2, not wildly overcalled) and this AI is late in bidding,
  // it should usually take one shot instead of being scared into 0.
  if(handSize===2&&maxTrumpRank>=9&&totalBid<=handSize&&remainingBidders<=2){
    bid=Math.max(bid,1);
  }

  // If every card is trump, bidding 0 is almost never sane. In tiny rounds,
  // trump-only hands are among the closest thing to a guarantee this game has.
  if(trump.length===hand.length&&hand.length>0){
    const ranks=trump.map(cardValue).sort((a,b)=>b-a);
    let trumpOnlyFloor=1;
    if(handSize===1){
      trumpOnlyFloor=1;
    }else if(lowRound){
      const top=ranks[0]||0;
      const second=ranks[1]||0;
      if(top>=14 || (top>=13&&second>=10) || (openingLeader&&top>=12) || (top>=12&&second>=12)){
        trumpOnlyFloor=2;
      }
    }else{
      trumpOnlyFloor=Math.max(1,Math.min(handSize,Math.round(trumpExpected+.2)));
    }
    bid=Math.max(bid,Math.min(handSize,trumpOnlyFloor));
  }

  return Math.max(0,Math.min(handSize,bid));
}

function estimateLongHandBid(p){
  const hand=p.hand;
  const handSize=Math.max(1,game.handSize);
  if(handSize<8)return null;
  const playerCount=game.players.length;
  const openingLeader=game.players.indexOf(p)===game.leaderIndex;
  const trump=hand.filter(c=>c.suit===game.trumpSuit);
  let expected=0;
  const suitCounts=Object.fromEntries(SUITS.map(s=>[s,hand.filter(c=>c.suit===s).length]));

  for(const c of hand){
    const v=cardValue(c);
    if(c.suit===game.trumpSuit){
      let val=0;
      if(v>=14)val=.98;
      else if(v>=13)val=.93;
      else if(v>=12)val=.85;
      else if(v>=11)val=.76;
      else if(v>=10)val=.66;
      else if(v>=9)val=.56;
      else if(v>=8)val=.47;
      else if(v>=7)val=.38;
      else if(v>=6)val=.31;
      else if(v>=5)val=.25;
      else if(v>=4)val=.20;
      else if(v>=3)val=.16;
      else val=.12;
      if(playerCount===2&&v>=9)val+=.05;
      expected+=Math.min(1,val);
    }else{
      let val=0;
      if(playerCount===2){
        val=v>=14?.92:v>=13?.72:v>=12?.56:v>=11?.42:v>=10?.31:v>=9?.22:v>=8?.16:v>=7?.11:.06;
      }else if(playerCount===3){
        val=v>=14?.82:v>=13?.60:v>=12?.43:v>=11?.30:v>=10?.20:v>=9?.13:.05;
      }else{
        val=v>=14?.70:v>=13?.46:v>=12?.29:v>=11?.18:v>=10?.10:.03;
      }
      if(suitCounts[c.suit]>=5&&v>=10)val+=playerCount===2?.08:.05;
      if(suitCounts[c.suit]<=2&&v<=10)val-=.03;
      expected+=Math.max(0,val);
    }
  }

  const expectedTrump=handSize*13/51;
  expected+=Math.max(0,trump.length-expectedTrump)*(playerCount===2?.24:.16);
  if(openingLeader)expected+=playerCount===2?.35:.18;

  const highCards=hand.filter(c=>cardValue(c)>=11).length;
  const aces=hand.filter(c=>cardValue(c)===14).length;
  const floor=playerCount===2
    ? Math.floor(trump.length*.45 + highCards*.28 + aces*.35 + handSize*.18)
    : Math.floor(trump.length*.34 + highCards*.20 + aces*.24);
  expected=Math.max(expected,floor);

  const pressure=bidTotalSoFar()/handSize;
  if(pressure>=1)expected*=playerCount===2?.92:.84;
  else if(pressure>=.88)expected*=playerCount===2?.96:.90;

  return Math.max(0,Math.min(handSize,expected));
}

function countRemainingBidders(){let count=0;let i=game.bidTurnIndex;while(i!==game.dealerIndex){count++;i=clockwiseNext(i);}return count+1;}
function rand(a,b){return a+Math.random()*(b-a);}
function scoreRank(p){const sorted=game.players.slice().sort((a,b)=>b.score-a.score);return sorted.indexOf(p)+1;}


function adaptiveGameplayMode(){
  if(!game||!game.players||!game.players.length)return 'Normal';
  const h=human();
  const s=ensurePlayerStats(h);
  const hands=s.hands||0;
  if(hands<3)return 'Normal';

  const rank=scoreRank(h);
  const exactRate=hands?s.bidHits/hands:.4;
  const aiScores=game.players.filter(p=>!p.human).map(p=>p.score);
  const bestAi=aiScores.length?Math.max(...aiScores):0;
  const avgAi=aiScores.length?aiScores.reduce((a,b)=>a+b,0)/aiScores.length:0;
  let rating=0;

  if(exactRate>=.58)rating+=1;
  else if(exactRate<=.25)rating-=1;

  if(rank===1)rating+=1;
  else if(rank===game.players.length)rating-=1;

  if(h.score-bestAi>=18)rating+=1;
  else if(bestAi-h.score>=18)rating-=1;

  if(h.score-avgAi>=14)rating+=1;
  else if(avgAi-h.score>=14)rating-=1;

  if(rating>=2)return 'Hard';
  if(rating<=-2)return 'Easy';
  return 'Normal';
}

function aiGameplayMode(){
  if(!game)return 'Normal';
  if(game.difficulty==='Adaptive')return adaptiveGameplayMode();
  return game.difficulty||'Normal';
}

function aiPlayProfile(){
  const mode=aiGameplayMode();
  if(mode==='Easy')return {mode,steal:.04,letOver:.08,trumpLead:.02};
  if(mode==='Hard')return {mode,steal:.82,letOver:.78,trumpLead:.68};
  return {mode,steal:.34,letOver:.30,trumpLead:.22};
}

function currentTrickWinner(){
  if(!game||!game.currentTrick||!game.currentTrick.length)return null;
  return determineWinnerForTest(game.currentTrick);
}

function playerTrickNeed(i){
  const p=game.players[i];
  if(!p||p.bid===null)return 0;
  return p.bid-p.tricks;
}

function opponentIsVulnerable(i){
  if(i===undefined||i===null||!game.players[i]||i===game.turnIndex)return false;
  const need=playerTrickNeed(i);
  return need>0 || need===0;
}

function disruptiveFollowCard(playerIndex,legal,canWin,losers,profile,need,remaining,onTarget,exceeded){
  if(!profile||profile.steal<=0)return null;
  const current=currentTrickWinner();
  if(!current||current.playerIndex===playerIndex)return null;
  const target=game.players[current.playerIndex];
  if(!target||target.bid===null)return null;
  const targetNeed=target.bid-target.tricks;
  const desperate=need>=remaining;

  // If an opponent still needs tricks and is currently winning, Hard/Adaptive-at-Hard
  // tries to steal that trick when it can still protect its own bid.
  if(targetNeed>0&&canWin.length&&!onTarget&&(need>0||exceeded||desperate)&&Math.random()<profile.steal){
    return lowestWinner(canWin);
  }

  // If an opponent is already at their bid and is currently winning, let them eat
  // the trick when the AI can afford not to win it.
  if(targetNeed===0&&losers.length&&!desperate&&Math.random()<profile.letOver){
    return dumpCard(losers,true);
  }

  return null;
}

function disruptiveTrumpLead(playerIndex,legal,profile,need,remaining,onTarget,exceeded){
  if(!profile||profile.trumpLead<=0||onTarget)return null;
  if(Math.random()>profile.trumpLead)return null;
  const trumps=legal.filter(c=>c.suit===game.trumpSuit).sort((a,b)=>cardValue(a)-cardValue(b));
  if(trumps.length<2)return null;
  const hasFutureTrump=trumps.some(c=>cardValue(c)>=11);
  const hasVulnerableOpponent=game.players.some((p,i)=>i!==playerIndex&&p.bid!==null&&opponentIsVulnerable(i));
  if(!hasFutureTrump||!hasVulnerableOpponent)return null;

  // Lead low trump to pull out stronger trump and clear the way for later trump.
  // Avoid doing it when the AI must win every remaining trick.
  if((need>0&&remaining>need)||exceeded){
    const lowTrump=trumps.find(c=>cardValue(c)<13)||trumps[0];
    return lowTrump;
  }
  return null;
}

function aiChooseCard(playerIndex){
  const p=game.players[playerIndex];
  const legalIds=legalCardsFor(playerIndex);
  const legal=p.hand.filter(c=>legalIds.includes(c.id));
  const remaining=p.hand.length;
  const need=p.bid-p.tricks;
  const exceeded=p.tricks>p.bid;
  const onTarget=p.tricks===p.bid;
  const handSize=Math.max(1,game.handSize);
  const lowRound=handSize<=2;
  const pressure=bidTotalSoFar()/handSize;
  const highPressure=pressure>=.95;
  const lowPressure=pressure<=.55;
  const canWin=legal.filter(c=>wouldCurrentlyWin(playerIndex,c));
  const losers=legal.filter(c=>!wouldCurrentlyWin(playerIndex,c));
  const lead=game.currentTrick.length===0;
  const profile=aiPlayProfile();

  if(exceeded)return highestBest(legal);

  if(onTarget){
    if(!lead){
      const current=currentTrickWinner();
      if(current&&current.playerIndex!==playerIndex&&losers.length&&Math.random()<profile.letOver){
        return dumpCard(losers,true);
      }
    }
    if(losers.length)return dumpCard(losers,true);
    return lowestBest(legal);
  }

  if(lead){
    const trumpLead=disruptiveTrumpLead(playerIndex,legal,profile,need,remaining,onTarget,exceeded);
    if(trumpLead)return trumpLead;
  }else{
    const disruption=disruptiveFollowCard(playerIndex,legal,canWin,losers,profile,need,remaining,onTarget,exceeded);
    if(disruption)return disruption;
  }

  if(need>=remaining)return canWin.length?lowestWinner(canWin):highestBest(legal);

  if(lead){
    if(need>0){
      if(lowRound&&lowPressure){
        const strongNonTrump=legal.filter(c=>c.suit!==game.trumpSuit&&cardValue(c)>=12).sort((a,b)=>cardValue(b)-cardValue(a));
        if(strongNonTrump.length)return strongNonTrump[0];
      }
      if(highPressure&&need<remaining){
        const nonTrump=legal.filter(c=>c.suit!==game.trumpSuit);
        if(nonTrump.length)return lowestBest(nonTrump);
        return lowestBest(legal);
      }
      const strong=legal.slice().sort((a,b)=>playPower(b)-playPower(a));
      return strong[0];
    }
    return lowestBest(legal);
  }

  const lastToPlay=game.currentTrick.length===game.players.length-1;
  if(need>0){
    if(lowRound&&lastToPlay&&canWin.length&&lowPressure)return lowestWinner(canWin);
    if(highPressure&&losers.length&&need<remaining){
      return dumpCard(losers,true);
    }
    if(lastToPlay&&canWin.length)return lowestWinner(canWin);
    if(need>=Math.ceil(remaining/2)&&canWin.length)return lowestWinner(canWin);
    if(losers.length)return dumpCard(losers,highPressure);
    return lowestBest(legal);
  }
  return lowestBest(legal);
}
function wouldCurrentlyWin(playerIndex,card){
  const test=game.currentTrick.concat([{playerIndex,card}]);return determineWinnerForTest(test).playerIndex===playerIndex;
}
function determineWinnerForTest(trick){const trump=trick.filter(t=>t.card.suit===game.trumpSuit);const contenders=trump.length?trump:trick.filter(t=>t.card.suit===trick[0].card.suit);return contenders.reduce((best,t)=>cardValue(t.card)>cardValue(best.card)?t:best,contenders[0]);}
function playPower(c){return (c.suit===game.trumpSuit?100:0)+cardValue(c);}
function highestBest(cards){return cards.slice().sort((a,b)=>playPower(b)-playPower(a))[0];}
function lowestBest(cards){return cards.slice().sort((a,b)=>playPower(a)-playPower(b))[0];}
function lowestWinner(cards){return cards.slice().sort((a,b)=>playPower(a)-playPower(b))[0];}
function dumpCard(cards,dumpDanger){return cards.slice().sort((a,b)=>dumpDanger?playPower(b)-playPower(a):playPower(a)-playPower(b))[0];}

function render(winningIndex=null){
  renderSeats();renderTopInfo();renderTrick(winningIndex);renderTrump();renderHand();renderDrawerPages();els.continueBtn.disabled=!hasSave();requestAnimationFrame(updateTurnRacerOverlay);
}
function renderSeats(){
  [...els.table.querySelectorAll('.seat')].forEach(n=>n.remove());
  if(!game)return;
  game.players.forEach((p,i)=>{
    const seat=document.createElement('div');seat.dataset.playerIndex=String(i);const pos=playerPos(i);seat.className=`seat pos-${pos} ${i===0?'human':''} ${i===game.leaderIndex?'leadPlayer':''} ${game.turnIndex===i&&game.phase==='playing'?'turn':''} ${bidThinkingIndex===i?'bidThinking':''} ${bidFlashIndex===i?'bidFlash':''} ${p.bid!==null&&p.tricks===p.bid?'metBid':''} ${metBidFlashIndex===i?'metBidFlash':''} ${p.bid!==null&&p.tricks>p.bid?'missedBid':''} ${missedBidFlashIndex===i?'missedBidFlash':''}`;
    const dealer=i===game.dealerIndex?'<span class="pill">D</span>':'';const turn=(game.phase==='playing'&&game.turnIndex===i)?'<span class="pill">TURN</span>':'';const bid=p.bid===null?'—':p.bid;const status=playerStatus(p);const markers=`${dealer}${turn}`;
    seat.innerHTML=`<div class="seatMarkers">${markers}</div><div class="seatName"><span>${escapeHtml(p.name)}</span></div><div class="seatRows"><div class="seatStat bidStat">Bid <b>${bid}</b></div><div class="seatStat trickStat" data-trick-stat-player="${i}">Tricks <b class="trickCountValue" data-trick-count-player="${i}">${p.tricks}</b></div></div>`;
    els.table.appendChild(seat);
  });
}
function playerStatus(p){
  if(!game||game.phase==='bidding')return p.bid===null?'Waiting':'Ready';
  if(p.bid===null)return 'No bid yet';
  if(p.tricks>p.bid)return 'Missed · maximize points';
  if(p.tricks===p.bid)return 'On target · avoid wins';
  const need=p.bid-p.tricks;return `Needs ${need} more`;
}
function renderTopInfo(){
  if(!game){els.topInfo.innerHTML='<span class="infoChip gold">What the Heck</span>';return;}
  const bidTotal=game.players.reduce((sum,p)=>sum+(p.bid===null?0:p.bid),0);
  els.topInfo.innerHTML=`<button class="infoChip scoreToggleBtn" type="button" data-show-scores="1">Scores</button><div class="roundInfoLine"><span class="infoChip gold">Hand ${game.handNumber}</span><span class="infoChip">${game.handSize} card${game.handSize===1?'':'s'}</span><span class="infoChip bidTotalChip">Bid ${bidTotal}/${game.handSize}</span></div>`;
}
function renderTrick(winningIndex){
  if(!game||!game.currentTrick.length){els.trickRing.innerHTML=`<div class="emptyCenter">${game?game.phase==='bidding'?'':playerLeadPhrase(game.leaderIndex,'next'):'Start a game to reveal trump.'}</div>`;return;}
  els.trickRing.innerHTML=game.currentTrick.map((t,idx)=>{const pos=playerPos(t.playerIndex);const classes=[winningIndex===t.playerIndex?'playedWin':'',idx===0?'ledCard':'',cardMotionCardId===t.card.id?'motionTargetHold':''].filter(Boolean).join(' ');return `<div class="trickCard trick-${pos}">${cardHTML(t.card,classes)}<div class="playedBy">${escapeHtml(game.players[t.playerIndex].name)}</div></div>`;}).join('');
}
function renderTrump(){
  if(!game||!game.trumpCard){els.trumpBox.innerHTML='';return;}
  els.trumpBox.innerHTML=`<div class="trumpPanel" role="button" tabindex="0" aria-label="Trump status"><div class="trumpCardWrap">${cardHTML(game.trumpCard)}</div><div class="trumpLabel"><b>TRUMP</b><span>${game.trumpSuit} ${SUIT_NAMES[game.trumpSuit]}</span><small>${game.trumpBroken?'Broken':'Locked'}</small></div></div>`;
  const panel=els.trumpBox.querySelector('.trumpPanel');
  if(panel){
    const handler=()=>showTrumpModal();
    panel.addEventListener('click',handler);
    panel.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();}});
  }
}
function trumpStatusText(){
  if(!game||!game.trumpSuit)return 'Trump has not been revealed yet.';
  if(game.trumpBroken)return `Trump is broken. ${SUIT_NAMES[game.trumpSuit]} can be led now.`;
  return `Trump is locked. ${SUIT_NAMES[game.trumpSuit]} cannot be led yet, unless a player only has trump. Trump may still be played when a player cannot follow suit.`;
}
function showTrumpModal(){
  if(!els.trumpModal||!els.trumpModalBody)return;
  if(!game||!game.trumpCard){
    els.trumpModalBody.innerHTML='<div></div><div class="trumpPeekText">Trump has not been revealed yet.</div>';
  }else{
    const status=game.trumpBroken?'Broken':'Locked';
    els.trumpModalBody.innerHTML=`<div class="trumpCardWrap">${cardHTML(game.trumpCard)}</div><div class="trumpPeekText"><b>${SUIT_NAMES[game.trumpSuit]}</b> is trump. Status: <b>${status}</b>.<br>${escapeHtml(trumpStatusText())}</div>`;
  }
  openModal(els.trumpModal);
}

function fitHandCards(){
  if(!els.handGrid)return;
  const cards=[...els.handGrid.querySelectorAll('.card')];
  const count=cards.length;
  if(!count)return;
  const rect=els.handGrid.getBoundingClientRect();
  if(!rect.width||!rect.height)return;
  const ratio=64/46;

  if(els.handGrid.classList.contains('massiveHand')){
    const gap=4;
    const targetW=40;
    const cols=Math.max(5,Math.floor((rect.width-8+gap)/(targetW+gap)));
    const cardW=Math.floor(Math.max(34,Math.min(40,(rect.width-8-gap*(cols-1))/cols)));
    const cardH=Math.floor(cardW*ratio);
    els.handGrid.style.setProperty('--fitHandCardW',`${cardW}px`);
    els.handGrid.style.setProperty('--fitHandCardH',`${cardH}px`);
    return;
  }

  const gap=3;
  const availableW=Math.max(40,rect.width-4-gap*(count-1));
  const availableH=Math.max(40,rect.height-6);
  const byWidth=availableW/count;
  const byHeight=availableH/ratio;
  const cardW=Math.floor(Math.max(30,Math.min(45,byWidth,byHeight)));
  const cardH=Math.floor(cardW*ratio);
  els.handGrid.style.setProperty('--fitHandCardW',`${cardW}px`);
  els.handGrid.style.setProperty('--fitHandCardH',`${cardH}px`);
}

function renderHand(){
  if(!game){
    els.handGrid.innerHTML='';
    els.handMeta.textContent='0 cards';
    els.handGrid.classList.remove('massiveHand');
    els.handGrid.closest('.handPanel')?.classList.remove('massiveHand');
    return;
  }
  const p=human();
  const boardWidth=els.handGrid.getBoundingClientRect().width||window.innerWidth||360;
  const singleRowMinWidth=(p.hand.length*30)+Math.max(0,p.hand.length-1)*3+8;
  const massiveHand=p.hand.length>=15||singleRowMinWidth>boardWidth;
  els.handGrid.classList.toggle('massiveHand',massiveHand);
  els.handGrid.closest('.handPanel')?.classList.toggle('massiveHand',massiveHand);
  const legal=new Set(legalCardsFor(0));
  const order=responsiveSuitOrder(p.hand);
  const orderedCards=[];
  order.forEach(suit=>{
    const cards=p.hand.filter(card=>card.suit===suit).sort((a,b)=>cardValue(a)-cardValue(b));
    orderedCards.push(...cards);
  });
  els.handMeta.textContent=`${p.hand.length} card${p.hand.length===1?'':'s'}`;
  els.handGrid.innerHTML=orderedCards.map(card=>{
    const classes=[legal.has(card.id)&&game.turnIndex===0?'legal':'',game.queuedCardId===card.id?'queued':''].filter(Boolean).join(' ');
    return cardHTML(card,classes);
  }).join('');
  [...els.handGrid.querySelectorAll('.card')].forEach(el=>{el.addEventListener('click',()=>onHumanCardTap(el.dataset.cardId));});
  requestAnimationFrame(fitHandCards);
}
function renderDrawerPages(){renderRules();renderTrainer();renderLog();renderSettings();renderAppearance();}
function pageShell(title,content){return `<div class="subTop"><button class="backBtn" data-back="1">‹</button><div class="drawerTitle">${title}</div></div>${content}`;}

function renderScoreModal(){
  if(!els.scoreModalBody)return;
  if(!game){els.scoreModalBody.innerHTML='<div class="scorePeekRow"><div class="scorePeekPlace">—</div><div class="scorePeekName">No game yet</div><div class="scorePeekValue">0</div></div>';return;}
  const ranked=game.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score || a.i-b.i);
  els.scoreModalBody.innerHTML=ranked.map((entry,idx)=>`
    <div class="scorePeekRow ${entry.p.human?'you':''}">
      <div class="scorePeekPlace">${idx+1}</div>
      <div class="scorePeekName">${escapeHtml(entry.p.human?'You':entry.p.name)}</div>
      <div class="scorePeekValue">${entry.p.score}</div>
    </div>
  `).join('');
}
function showScores(){renderScoreModal();openModal(els.scoreModal);}

function renderRules(){els.pages.rules.innerHTML=pageShell('Rules',`<div class="section"><h3>How to win</h3><p>Score the most points by the end of the game. Each trick is worth 1 point. If you win exactly the number of tricks you bid, you also get a 10-point bonus.</p></div><div class="section"><h3>Setup</h3><p>Each hand uses one standard 52-card deck. Everyone gets the same number of cards, and one undealt card is flipped face up. That card's suit is trump for the whole hand.</p></div><div class="section"><h3>Bidding</h3><p>Starting left of the dealer, each player bids from 0 to the number of cards in the hand. There is no restriction on the total bids.</p></div><div class="section"><h3>Playing tricks</h3><ol><li>The player left of the dealer leads the first trick.</li><li>Everyone plays one card clockwise.</li><li>You must follow the led suit if you can.</li><li>If you cannot follow suit, you may play any card.</li><li>Highest led-suit card wins unless trump is played.</li><li>If trump is played, highest trump wins.</li><li>The trick winner leads the next trick.</li></ol></div><div class="section"><h3>Trump</h3><p>Trump cannot be led until it is broken. Trump is broken when someone cannot follow suit and legally plays a trump card. If a player only has trump cards, they may lead trump even if it is not broken.</p></div><div class="section"><h3>Game ending</h3><p>Hands count down by one card. In the full game, the one-card hand repeats and then the game counts back up to the starting hand size. If tiebreaker is on, the full table plays another final-size hand to resolve a tie for first.</p></div>`);}
function renderTrainer(){
  let hint='Start a game to get advice.';
  if(game){hint=buildHint();}
  els.pages.trainer.innerHTML=pageShell('Hint / Trainer',`<div class="section"><h3>Current Hint</h3><p>${escapeHtml(hint)}</p></div><div class="section"><h3>Explain Last Turn</h3><p>${escapeHtml(game?game.lastExplanation:'No turn yet.')}</p></div><div class="section"><h3>Trainer Stats</h3><p>Hands played: ${game?game.handNumber:0}</p><p>Difficulty: ${game?escapeHtml(game.difficulty+(game.difficulty==='Adaptive'?` → ${aiGameplayMode()} play style`:'')):'—'}</p><p>This trainer is rule-aware in both bidding and play: it checks trump, follow-suit requirements, bid status, and whether a player should chase or avoid tricks.</p></div>`);
}
function buildHint(){
  if(game.phase==='bidding')return `Bid based on sure winners. High trump and aces are strongest, but short suits can also help you dump or trump later.`;
  if(game.phase==='playing'&&game.turnIndex===0){const legal=legalCardsFor(0).map(id=>human().hand.find(c=>c.id===id));const status=playerStatus(human());if(human().tricks>=human().bid)return `${status}. Look for a legal low card or an off-suit dump so you do not accidentally win.`;if(game.currentTrick.length){const winners=legal.filter(c=>wouldCurrentlyWin(0,c));return winners.length?`You still need tricks. ${cardLabel(lowestWinner(winners))} is the cheapest card that currently wins.`:`You cannot currently win this trick. Dump a card that will not hurt your plan.`;}return `You need ${human().bid-human().tricks} more. Leading a high card or strong trump can help, but only lead trump if it is legal.`;}
  return `Watch bid status. Once someone exceeds their bid, they should try to win as many tricks as possible because the exact-bid bonus is already gone.`;
}
function renderLog(){const entries=game&&game.log.length?game.log.map(e=>`<div class="logEntry"><strong>${escapeHtml(e.title)}</strong><p>${escapeHtml(e.body)}</p><p class="smallHelp">${escapeHtml(e.at)}</p></div>`).join(''):'<div class="section"><p>No log entries yet.</p></div>';els.pages.log.innerHTML=pageShell('Log / History',entries);}
function renderSettings(){els.pages.settings.innerHTML=pageShell('Settings',`<div class="section"><h3>Gameplay</h3><div class="controlRow"><label>Confirm card plays</label><button class="toggle ${settings.confirmPlay?'on':''}" data-setting-toggle="confirmPlay"></button></div><div class="controlRow"><label>Queue next card</label><button class="toggle ${settings.queue?'on':''}" data-setting-toggle="queue"></button></div><div class="controlRow"><label>Animation speed</label><select data-setting-select="animationSpeed"><option value="fast" ${settings.animationSpeed==='fast'?'selected':''}>Fast</option><option value="normal" ${settings.animationSpeed==='normal'?'selected':''}>Normal</option><option value="slow" ${settings.animationSpeed==='slow'?'selected':''}>Slow</option></select></div><p class="smallHelp">New-game-only options like AI count, starting cards, difficulty, and game length stay on the setup screen.</p></div><div class="section"><h3>Turn Border</h3><div class="controlRow"><label>Indicator style</label><select data-setting-select="turnBorderStyle"><option value="none" ${settings.turnBorderStyle==='none'?'selected':''}>None</option><option value="static" ${settings.turnBorderStyle==='static'?'selected':''}>Static border</option><option value="racer" ${settings.turnBorderStyle==='racer'?'selected':''}>Border racer</option><option value="rainbow" ${settings.turnBorderStyle==='rainbow'?'selected':''}>Rainbow racer</option></select></div><div class="controlRow"><label>Border color</label><select data-setting-select="turnBorderPreset"><option value="none" ${settings.turnBorderPreset==='none'?'selected':''}>None</option><option value="gold" ${settings.turnBorderPreset==='gold'?'selected':''}>Gold</option><option value="blue" ${settings.turnBorderPreset==='blue'?'selected':''}>Blue</option><option value="green" ${settings.turnBorderPreset==='green'?'selected':''}>Green</option><option value="red" ${settings.turnBorderPreset==='red'?'selected':''}>Red</option><option value="purple" ${settings.turnBorderPreset==='purple'?'selected':''}>Purple</option><option value="white" ${settings.turnBorderPreset==='white'?'selected':''}>White</option><option value="custom" ${settings.turnBorderPreset==='custom'?'selected':''}>Custom</option></select></div><div class="controlRow turnBorderColorRow"><label>Custom color</label><input type="color" data-setting-color="turnBorderColor" value="${escapeHtml(settings.turnBorderColor||'#f0ca68')}"></div></div>`);}

function renderAppearance(){els.pages.appearance.innerHTML=pageShell('Appearance',`<div class="section"><h3>Table Felt</h3><div class="segmented"><button class="segBtn appearanceChoice ${settings.felt==='green'?'active':''}" data-felt="green"><span class="colorPill green"></span>Green</button><button class="segBtn appearanceChoice ${settings.felt==='blue'?'active':''}" data-felt="blue"><span class="colorPill blue"></span>Blue</button><button class="segBtn appearanceChoice ${settings.felt==='purple'?'active':''}" data-felt="purple"><span class="colorPill purple"></span>Purple</button><button class="segBtn appearanceChoice ${settings.felt==='black'?'active':''}" data-felt="black"><span class="colorPill black"></span>Black</button></div></div><div class="section"><h3>Card Backs</h3><div class="segmented"><button class="segBtn appearanceChoice ${settings.cardBack==='blue'?'active':''}" data-back="blue"><span class="colorPill cardBlue"></span>Blue</button><button class="segBtn appearanceChoice ${settings.cardBack==='red'?'active':''}" data-back="red"><span class="colorPill red"></span>Red</button><button class="segBtn appearanceChoice ${settings.cardBack==='green'?'active':''}" data-back="green"><span class="colorPill green"></span>Green</button><button class="segBtn appearanceChoice ${settings.cardBack==='black'?'active':''}" data-back="black"><span class="colorPill black"></span>Black</button></div></div>`);}

function openDrawer(page){els.drawer.classList.add('open');if(page)openPage(page);}
function closeDrawer(){els.drawer.classList.remove('open');openHome();}
function openHome(){els.drawerTitle.textContent='Game Menu';els.drawerHome.classList.remove('hidden');Object.values(els.pages).forEach(p=>p.classList.remove('active'));}
function openPage(page){els.drawerTitle.textContent='Game Menu';els.drawerHome.classList.add('hidden');Object.values(els.pages).forEach(p=>p.classList.remove('active'));els.pages[page].classList.add('active');renderDrawerPages();}

function bindEvents(){
  window.addEventListener('resize',()=>{if(els.bidModal.classList.contains('open'))positionBidModal();fitHandCards();updateTurnRacerOverlay();});
  window.addEventListener('orientationchange',()=>setTimeout(()=>{if(els.bidModal.classList.contains('open'))positionBidModal();fitHandCards();updateTurnRacerOverlay();},120));
  els.startBtn.onclick=openSetup;els.continueBtn.onclick=()=>{if(loadGame()){render();exitSplash();if(game.phase==='bidding')continueBidding();else if(game.phase==='playing')continuePlay();else if(game.phase==='handOver')showRecap(false);else if(game.phase==='gameOver')showRecap(true);}};els.splashRulesBtn.onclick=()=>openDrawer('rules');
  els.closeSetup.onclick=()=>closeModal(els.setupModal);els.cancelSetup.onclick=()=>closeModal(els.setupModal);els.confirmSetup.onclick=startNewGameFromSetup;els.setupTiebreaker.onclick=()=>els.setupTiebreaker.classList.toggle('on');
  els.closeConfirm.onclick=()=>{pendingConfirm=null;closeModal(els.confirmModal);};els.cancelConfirm.onclick=els.closeConfirm.onclick;els.confirmPlayBtn.onclick=()=>{if(pendingConfirm)playHumanCard(pendingConfirm);};
  els.scoreModal.onclick=()=>closeModal(els.scoreModal);if(els.trumpModal)els.trumpModal.onclick=()=>closeModal(els.trumpModal);
  els.drawerTab.onclick=()=>els.drawer.classList.toggle('open');els.closeDrawer.onclick=closeDrawer;els.drawerNewGame.onclick=()=>{closeDrawer();openSetup();};
  document.addEventListener('click',e=>{const scoreBtn=e.target.closest('[data-show-scores]');if(scoreBtn){showScores();return;}const menu=e.target.closest('[data-page]');if(menu){openPage(menu.dataset.page);return;}if(e.target.closest('[data-back]')){openHome();return;}const tog=e.target.closest('[data-setting-toggle]');if(tog){settings[tog.dataset.settingToggle]=!settings[tog.dataset.settingToggle];saveSettings();render();return;}const felt=e.target.closest('[data-felt]');if(felt){settings.felt=felt.dataset.felt;saveSettings();render();return;}const back=e.target.closest('[data-back]');if(back&&!e.target.closest('[data-back="1"]')){settings.cardBack=back.dataset.back;saveSettings();render();}});
  document.addEventListener('change',e=>{const sel=e.target.closest('[data-setting-select]');if(sel){settings[sel.dataset.settingSelect]=sel.value;saveSettings();render();return;}const color=e.target.closest('[data-setting-color]');if(color){settings[color.dataset.settingColor]=color.value;settings.turnBorderPreset='custom';saveSettings();render();return;}});
}

function init(){bindEvents();applyAppearance();showSplash();render();}
init();
})();
